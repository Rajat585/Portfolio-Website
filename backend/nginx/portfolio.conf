# /etc/nginx/sites-available/portfolio
# Reverse proxy to Gunicorn + static/media serving + SSL (Let's Encrypt) + Gzip.

server {
    listen 80;
    server_name rajatverma.dev www.rajatverma.dev;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name rajatverma.dev www.rajatverma.dev;

    ssl_certificate     /etc/letsencrypt/live/rajatverma.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rajatverma.dev/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 10M;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 512;

    location /static/ {
        alias /var/www/portfolio/staticfiles/;
        expires 30d;
        add_header Cache-Control "public";
    }

    location /media/ {
        alias /var/www/portfolio/media/;
        expires 30d;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
